kind = "web"
previewPath = "/"
title = "Investment Forecast Orchestration Control Tower"
description = "A client-facing enterprise finance control tower for AI-assisted WBS forecasting, variance management, controlled approvals, simulated SAC submission, reporting and audit evidence."
version = "1.0.0"
id = "artifacts/investment-forecast-control-tower"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19926

[services.development]
run = "pnpm --filter @workspace/investment-forecast-control-tower run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/investment-forecast-control-tower", "run", "build" ]
serve = "static"
publicDir = "artifacts/investment-forecast-control-tower/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19926"
BASE_PATH = "/"
